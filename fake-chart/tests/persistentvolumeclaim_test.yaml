# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
---
suite: persistentvolumeclaim
templates:
  - persistentvolumeclaim.yaml
release:
  name: demo
tests:
  - it: renders a pvc from a component volume spec
    set:
      namespace: test-ns
      components:
        app:
          volumes:
            pvc:
              - name: config
                size: 1Gi
                accessMode: ReadWriteOnce
                storageClassName: test-class
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: demo-app-config
      - equal:
          path: metadata.namespace
          value: test-ns
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
      - equal:
          path: spec.storageClassName
          value: test-class
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi

  - it: omits storageClassName when it is not set
    set:
      namespace: test-ns
      components:
        app:
          volumes:
            pvc:
              - name: config
                size: 1Gi
                accessMode: ReadWriteOnce
    asserts:
      - notExists:
          path: spec.storageClassName

  - it: drops the component suffix when the release name contains it
    release:
      name: app
    set:
      namespace: test-ns
      components:
        app:
          volumes:
            pvc:
              - name: config
                size: 1Gi
                accessMode: ReadWriteOnce
    asserts:
      - equal:
          path: metadata.name
          value: app-config

  - it: renders one pvc per entry, prefixed by its component
    set:
      namespace: test-ns
      components:
        app:
          volumes:
            pvc:
              - name: config
                size: 1Gi
                accessMode: ReadWriteOnce
              - name: cache
                size: 5Gi
                accessMode: ReadWriteOnce
        worker:
          volumes:
            pvc:
              - name: data
                size: 2Gi
                accessMode: ReadWriteOnce
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: demo-app-config
        documentIndex: 0
      - equal:
          path: metadata.name
          value: demo-app-cache
        documentIndex: 1
      - equal:
          path: metadata.name
          value: demo-worker-data
        documentIndex: 2

  - it: labels each pvc with its own component
    set:
      namespace: test-ns
      components:
        app:
          volumes:
            pvc:
              - name: config
                size: 1Gi
                accessMode: ReadWriteOnce
        worker:
          volumes:
            pvc:
              - name: data
                size: 2Gi
                accessMode: ReadWriteOnce
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/component: app
            app.kubernetes.io/instance: demo
            app.kubernetes.io/name: fake-chart
        documentIndex: 0
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/component: worker
        documentIndex: 1

  - it: renders nothing when a component declares no volumes
    set:
      namespace: test-ns
      components:
        app: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when a component has volumes but no pvc
    set:
      namespace: test-ns
      components:
        app:
          volumes:
            nfs:
              - name: media
                mountPath: /media
                server: 10.0.0.1
                path: /media
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when the pvc list is empty
    set:
      namespace: test-ns
      components:
        app:
          volumes:
            pvc: []
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when there are no components
    set:
      namespace: test-ns
      components: {}
    asserts:
      - hasDocuments:
          count: 0
